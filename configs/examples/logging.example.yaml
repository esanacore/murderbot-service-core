# Example logging.yaml - copy to a real (untracked) config path on the
# deployed Pi and fill in real values. Do not commit the real file - see
# ../../.gitignore and ../../docs/security.md.
#
# Schema is consumed by services/src/murderbot_core/logging_setup.py's
# load_logging_config(); keep this file in sync with that parser.

level: INFO   # DEBUG | INFO | WARNING | ERROR | CRITICAL
destinations:
  - stdout   # captured by journald when run under systemd