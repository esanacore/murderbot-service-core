name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-type-test:
    name: Lint, type-check, and test (services/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy src

      - name: pytest
        run: pytest --cov=murderbot_core --cov-report=term-missing

  docs-link-check:
    name: Markdown / link check
    runs-on: ubuntu-latest
    steps:
      # submodules: true - many docs/*.md and root governance files link
      # into constitution/*.md; without it those links 404 against an
      # empty directory and every PR fails spuriously.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Lint markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !constitution/**
        continue-on-error: true

      - name: Check links
        uses: lycheeverse/lychee-action@v1
        with:
          # constitution/ is a submodule with its own CI; only check this
          # repository's own docs, not the constitution's.
          args: --no-progress --exclude-mail --exclude-path constitution "**/*.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
