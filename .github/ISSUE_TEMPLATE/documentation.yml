name: Documentation update
description: A doc is missing, out of date, or unclear.
title: "[docs] "
labels: ["documentation"]
body:
  - type: input
    id: file
    attributes:
      label: Which file?
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (if you have one)
